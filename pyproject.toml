[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "docling-guard"
version = "0.1.0"
description = "Offline provenance validation and regression checks for Docling JSON"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Arthur031221"}]
dependencies = []

[project.scripts]
docling-guard = "docling_guard.cli:main"

[tool.setuptools.packages.find]
include = ["docling_guard*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
