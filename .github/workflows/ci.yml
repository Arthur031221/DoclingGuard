name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install . ruff==0.13.3
      - name: Lint
        run: ruff check docling_guard tests demo
      - name: Tests
        run: python -m unittest discover -s tests -v
